name: flutter_application_1
description: "A new Flutter project."
publish_to: "none"

version: 1.0.6+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  fl_chart: ^1.0.0
  tflite_flutter: ^0.11.0
  image_picker: ^1.0.4
  camera: ^0.11.1
  permission_handler: ^12.0.0+1
  image: ^4.5.4
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.4.7
  path_provider: ^2.1.1
  pdf: ^3.10.4
  printing: ^5.12.0
  provider: ^6.0.5
  google_sign_in: ^6.1.5
  flutter_svg: ^2.0.9
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  uuid: ^4.2.2
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.4
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^17.0.0
  share_plus: ^7.2.1
  screenshot: ^2.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  timezone: ^0.9.4
  file_saver: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Launcher icon configuration
flutter_launcher_icons:
  # Android
  android: true         # generates mipmap/ic_launcher by default
  min_sdk_android: 21
  # iOS
  ios: true
  remove_alpha_ios: true
  # Web (PWA icons)
  web:
    generate: true
    image_path: assets/images/icon.png
    background_color: "#ffffff"
    theme_color: "#ffffff"
  # Use this single source image for all platforms
  image_path: assets/images/icon.png
  # Optional (Android adaptive icon). If you have layers, you can set these:
  # adaptive_icon_background: "#ffffff"
  # adaptive_icon_foreground: assets/images/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/model/cataract_model.tflite
    - assets/images/  